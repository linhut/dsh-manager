# @dsh-manager/dsh-capability-router 的 bundle 补丁层：
# 作为随 DSH Manager 内置的插件安装时，把能力路由服务插入 profile 的组合树。
- insert:
    - id: capability-router
      name: '@dsh-manager/dsh-capability-router'
      config:
        enabled: true
        defaultCapability: semantic
        capabilities: {}
